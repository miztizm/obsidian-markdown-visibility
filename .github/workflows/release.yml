name: Release Obsidian plugin

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'   # trigger when package.json changes

permissions:
  contents: write   # needed for gh release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # Need 2 commits to compare version change

      - name: Check if version changed
        id: version_check
        run: |
          # Get current version from package.json
          current_version=$(node -p "require('./package.json').version")
          
          # Get previous version from package.json in previous commit
          previous_version=$(git show HEAD^:package.json | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin', 'utf8')).version" 2>/dev/null || echo "0.0.0")
          
          echo "Current version: $current_version"
          echo "Previous version: $previous_version"
          
          if [ "$current_version" != "$previous_version" ]; then
            echo "Version changed from $previous_version to $current_version"
            echo "version=$current_version" >> $GITHUB_OUTPUT
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "Version not changed, skipping release"
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Use Node.js
        if: steps.version_check.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: 'npm'

      - name: Build plugin
        if: steps.version_check.outputs.changed == 'true'
        run: |
          npm ci
          npm run build

      - name: Create tag
        if: steps.version_check.outputs.changed == 'true'
        run: |
          version="${{ steps.version_check.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --tags origin "refs/tags/$version" | grep -q "$version"; then
            echo "Tag $version already exists on remote, skipping tag creation"
          else
            git tag -a "$version" -m "Release $version"
            git push origin "$version"
          fi

      - name: Extract changelog for this version
        if: steps.version_check.outputs.changed == 'true'
        id: changelog
        run: |
          version="${{ steps.version_check.outputs.version }}"
          if [ -f "CHANGELOG.md" ]; then
            # Extract notes between this version and the next heading
            awk -v version="$version" '
              /^## / { if (found) exit; if ($2 == version || $2 == "["version"]") found=1; next }
              found { print }
            ' CHANGELOG.md > release_notes.txt
            echo "notes_file=release_notes.txt" >> $GITHUB_OUTPUT
          else
            echo "notes_file=" >> $GITHUB_OUTPUT
          fi

      - name: Create release
        if: steps.version_check.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          version="${{ steps.version_check.outputs.version }}"
          
          echo "Creating release for version: $version"
          
          # Check the built files exist
          ls -l dist/

          # Create release with changelog notes or auto-generated notes
          if gh release view "$version" > /dev/null 2>&1; then
            # A release that already exists may be EMPTY (created by hand in the UI, or by a
            # run that died between "Create tag" and "Create release" — issue #2, BRAT failed
            # with "no manifest.json in the latest release"). Skipping creation must never
            # skip the assets: heal the existing release instead.
            #
            # Heal it by attaching ONLY the missing assets. Overwriting every asset would
            # delete each existing asset before its replacement is uploaded, so a transient API
            # or network failure mid-upload can leave the release with fewer assets than it had
            # before the repair attempt (P1 review on #4). Assets that are complete (state
            # "uploaded", non-zero size) are never deleted; a rerun against a healthy release is
            # a no-op.
            #
            # Asset metadata also carries a state: only "uploaded" assets are downloadable. A
            # failed upload can leave a same-named "starter" placeholder that is unusable and
            # blocks a fresh upload, so it is treated as missing, deleted, and re-uploaded.
            echo "Release $version already exists, checking for missing assets"
            assets=$(gh release view "$version" --json assets --jq '.assets[] | [.name, .state, (.size | tostring)] | @tsv')

            to_delete=()
            to_upload=()
            for asset in main.js manifest.json styles.css; do
              state=$(awk -F '\t' -v name="$asset" '$1 == name { print $2; exit }' <<< "$assets")
              size=$(awk -F '\t' -v name="$asset" '$1 == name { print $3; exit }' <<< "$assets")
              case "$size" in ''|*[!0-9]*) size=0 ;; esac
              if [ "$state" = "uploaded" ] && [ "$size" -gt 0 ]; then
                echo "Asset $asset already attached, keeping it"
              elif [ -n "$state" ]; then
                echo "Asset $asset is unusable (state: $state, size: $size), will replace it"
                to_delete+=("$asset")
                to_upload+=("dist/$asset")
              else
                echo "Asset $asset missing, will upload"
                to_upload+=("dist/$asset")
              fi
            done

            # Incomplete entries hold no usable data, so deleting only those is safe.
            for asset in "${to_delete[@]}"; do
              gh release delete-asset "$version" "$asset" --yes
            done

            if [ "${#to_upload[@]}" -eq 0 ]; then
              echo "All assets already attached to release $version"
            else
              gh release upload "$version" "${to_upload[@]}"
            fi
          elif [ -n "${{ steps.changelog.outputs.notes_file }}" ] && [ -f "${{ steps.changelog.outputs.notes_file }}" ]; then
            gh release create "$version" \
              --title "Release $version" \
              --notes-file "${{ steps.changelog.outputs.notes_file }}" \
              dist/main.js \
              dist/manifest.json \
              dist/styles.css
          else
            gh release create "$version" \
              --title "Release $version" \
              --generate-notes \
              dist/main.js \
              dist/manifest.json \
              dist/styles.css
          fi
          
          # To create draft releases instead, add --draft flag to gh release create commands above
